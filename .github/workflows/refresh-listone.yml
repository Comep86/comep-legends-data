name: Aggiorna listone

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/refresh-listone.mjs"
      - ".github/workflows/refresh-listone.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-listone
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica e valida il listone
        run: node scripts/refresh-listone.mjs
      - name: Pubblica stato o JSON dell'importazione
        if: always()
        run: |
          git config user.name "COMEP Legends Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listone.json data/import-status.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione."
            exit 0
          fi
          git commit -m "Aggiorna listone"
          git push
